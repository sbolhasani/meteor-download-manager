name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # run by "Tag release" with --ref vX.Y.Z (tags made with the workflow token start no push runs)
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release version and tag
        run: python3 scripts/check-release.py
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ffmpeg-cache/mac
          key: ffmpeg-mac-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Native torrent build tools
        run: brew list ninja pkgconf >/dev/null 2>&1 || brew install ninja pkgconf
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-mac-current-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
      - name: Prepare native Apple torrent SDK
        run: python3 scripts/build-torrent-apple.py
      - name: Tests
        run: swift test --package-path mac
      - name: Build (Apple silicon and Intel)
        run: bash scripts/build-app.sh
      - name: Check the app before anything is published (every tool present, runs, and is built for both chips)
        run: |
          set -euo pipefail
          A="build/Nexonic Download Manager.app/Contents"
          for f in MacOS/NexonicDownloadManager MacOS/nexonic-host MacOS/ffmpeg MacOS/ffprobe MacOS/nexonic-video-engine MacOS/qjs; do
            test -x "$A/$f" || { echo "missing: $f"; exit 1; }
          done
          test -f "$A/Resources/Extension/manifest.json"
          "$A/MacOS/nexonic-host" help | grep -q "ndm batch"
          "$A/MacOS/ffmpeg" -hide_banner -muxers | grep -q " mp4 "
          "$A/MacOS/nexonic-video-engine" --version
          "$A/MacOS/qjs" -e 'console.log("qjs ok")'
          for f in MacOS/NexonicDownloadManager MacOS/nexonic-host MacOS/ffmpeg; do
            archs="$(lipo -archs "$A/$f")"; echo "$f: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "$f is not universal"; exit 1; }
          done
          codesign --verify --deep --strict "build/Nexonic Download Manager.app"
          plutil -lint "$A/Info.plist"
      - name: Sign the Firefox add-on with Mozilla (when the AMO keys are set)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Firefox only installs signed add-ons. "unlisted" = signed for download from GitHub, not shown in the store.
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            # Firefox refuses unsigned add-ons: never publish one as if it worked.
            echo "::error::AMO keys missing: the Firefox add-on would be unsigned. Add AMO_JWT_ISSUER and AMO_JWT_SECRET."; exit 1
          fi
          V="$(cat VERSION)"
          npx --yes web-ext@8 sign --source-dir build/extension-firefox --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --artifacts-dir build/signed --timeout 900000
          signed="$(ls build/signed/*.xpi | head -1)"
          cp "$signed" "build/NexonicFirefoxAddon-$V.xpi"
          echo "Signed: $signed"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        # Files keep the same names in every release, so the README's direct download links always fetch the latest.
        run: |
          V="$(cat VERSION)"
          mkdir up
          cp "build/NexonicDownloadManager-$V.dmg" up/NexonicDownloadManager-Mac.dmg
          # Plain zip of the app for the one-line Terminal installer (no disk image to mount).
          ditto -c -k --keepParent "build/Nexonic Download Manager.app" up/NexonicDownloadManager-Mac.zip
          cp "build/NexonicExtension-$V.zip" up/NexonicExtension-Chrome.zip
          cp "build/NexonicFirefoxAddon-$V.xpi" up/NexonicAddon-Firefox.xpi
          cat packaging/RELEASE-HEADER.md CHANGELOG.md > build/release-notes.md
          # Create the draft without files first, then upload with retries: a GitHub server error during a large upload
          # (0.12.0, 0.14.0) used to fail the whole release. A re-run reuses the draft that is already there.
          draft() { gh release list --json tagName,isDraft -q ".[] | select(.isDraft and .tagName == \"$GITHUB_REF_NAME\") | .tagName" | grep -qx "$GITHUB_REF_NAME"; }
          for try in 1 2 3; do
            draft || gh release create "$GITHUB_REF_NAME" --draft --title "Nexonic Download Manager $V" --notes-file build/release-notes.md && break
            echo "Creating the draft failed (try $try)"; sleep 20
          done
          for try in 1 2 3 4; do
            gh release upload "$GITHUB_REF_NAME" up/* --clobber && exit 0
            echo "Upload failed (try $try); retrying"; sleep 30
          done
          exit 1
  ffmpeg-windows:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: .ffmpeg-cache/windows
          key: ffmpeg-windows-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq mingw-w64 && bash scripts/build-ffmpeg.sh windows .ffmpeg-cache/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - name: Video engine for Windows
        run: bash scripts/fetch-video-tools.sh windows .tools-cache/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tools-windows
          path: .tools-cache/windows
  linux:
    permissions:
      contents: write
    needs: release
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and test tools
        # A stuck package mirror must not hold a release for an hour: each try is limited and retried.
        timeout-minutes: 25
        run: |
          for try in 1 2 3; do
            timeout 420 sudo apt-get update -qq && timeout 600 sudo apt-get install -y -qq rpm xvfb xauth imagemagick desktop-file-utils ffmpeg ninja-build pkg-config autoconf automake libtool >/dev/null && exit 0
            echo "Package install failed or stalled (try $try); retrying"; sleep 20
          done
          exit 1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: ffmpeg
        with:
          path: .ffmpeg-cache/linux-${{ matrix.arch }}
          key: ffmpeg-linux-${{ matrix.arch }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh linux .ffmpeg-cache/linux-${{ matrix.arch }}
      - name: Video engine
        run: bash scripts/fetch-video-tools.sh linux-${{ matrix.arch }} .tools-cache/linux-${{ matrix.arch }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-linux-${{ matrix.arch }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
      - name: Native torrent engine and legal-data transfer
        run: python3 scripts/build-torrent-native.py linux-${{ matrix.arch }} --test
      - name: Managed provider integration
        run: dotnet run --project native/tests/dotnet -p:NativeTorrentLibrary="$GITHUB_WORKSPACE/.native-cache/sdk/linux-${{ matrix.arch }}/lib/libnexonic_torrent.so" -- .native-cache/sdk/linux-${{ matrix.arch }}/lib/libnexonic_torrent.so
      - name: Tests
        run: dotnet test linux/Tests/Tests.csproj -p:NativeTorrentLibrary="$GITHUB_WORKSPACE/.native-cache/sdk/linux-${{ matrix.arch }}/lib/libnexonic_torrent.so"
      - name: Build the app, AppImage, .deb and .rpm
        run: bash linux/packaging/build.sh ${{ matrix.arch }} .ffmpeg-cache/linux-${{ matrix.arch }} .tools-cache/linux-${{ matrix.arch }}
      - name: Check the app before it is published (every tool present, packages install, windows open)
        run: bash linux/packaging/check.sh ${{ matrix.arch }}
      - name: Smoke test the packaged app before it is published
        run: |
          T="$RUNNER_TEMP/smoke" && mkdir -p "$T" && cd "$T"
          "$GITHUB_WORKSPACE"/build/linux-${{ matrix.arch }}/*.AppImage --appimage-extract >/dev/null
          python3 "$GITHUB_WORKSPACE/linux/packaging/smoke.py" "$T/squashfs-root/usr/lib/nexonic-download-manager" "$T/run"
      - name: Add the Linux files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          O=build/linux-${{ matrix.arch }}
          gh release upload "$GITHUB_REF_NAME" "$O"/*.AppImage "$O"/*.deb "$O"/*.rpm "$O"/SHA256SUMS-linux-*.txt
  windows:
    permissions:
      contents: write
    needs: [release, ffmpeg-windows, linux]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ffmpeg-windows
          path: .ffmpeg-cache/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: tools-windows
          path: .tools-cache/windows
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .native-cache/installed
            .native-cache/binaries
            .native-cache/vcpkg/downloads
          key: native-win-x64-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
      - name: Native torrent engine and legal-data transfer
        run: python scripts/build-torrent-native.py win-x64 --test
      - name: Managed provider integration
        shell: pwsh
        run: dotnet run --project native/tests/dotnet "-p:NativeTorrentLibrary=$env:GITHUB_WORKSPACE/.native-cache/sdk/win-x64/bin/nexonic_torrent.dll" -- .native-cache/sdk/win-x64/bin/nexonic_torrent.dll
      - name: Tests
        run: dotnet test windows/Tests/Tests.csproj
      - run: ./windows/build.ps1
        shell: pwsh
      - name: Check the app before it is published (every tool present and running)
        shell: pwsh
        run: |
          foreach ($f in "NexonicDownloadManager.exe", "nexonic-host.exe", "ffmpeg.exe", "ffprobe.exe", "video-engine\nexonic-video-engine.exe", "nexonic_torrent.dll") {
            if (-not (Test-Path "build\win\$f")) { throw "missing from the app folder: $f" }
          }
          $m = & build\win\ffmpeg.exe -hide_banner -muxers 2>&1 | Out-String
          if ($m -notmatch " mp4 ") { throw "ffmpeg has no mp4 muxer" }
          & build\win\video-engine\nexonic-video-engine.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the video engine does not run" }
          $v = (Get-Content VERSION).Trim()
          if (-not (Test-Path "build\NexonicDownloadManager-Setup-$v.exe")) { throw "the installer was not built" }
      - name: Add the Windows files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          Copy-Item "build\NexonicDownloadManager-Setup-$v.exe" build\NexonicDownloadManager-Windows-Setup.exe
          Copy-Item "build\NexonicDownloadManager-$v-windows-portable.zip" build\NexonicDownloadManager-Windows-Portable.zip
          gh release upload $env:GITHUB_REF_NAME build\NexonicDownloadManager-Windows-Setup.exe build\NexonicDownloadManager-Windows-Portable.zip
      - name: Attach latest.json (update details the apps read when GitHub's API refuses)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $v = (Get-Content VERSION).Trim()
          if ($tag -ne "v$v") { throw "Release tag $tag does not match VERSION $v" }
          $required = @(
            "NexonicDownloadManager-Mac.dmg", "NexonicDownloadManager-Mac.zip",
            "NexonicDownloadManager-Windows-Setup.exe", "NexonicDownloadManager-Windows-Portable.zip",
            "NexonicDownloadManager-Linux-x86_64.AppImage", "NexonicDownloadManager-Linux-aarch64.AppImage",
            "NexonicExtension-Chrome.zip", "NexonicAddon-Firefox.xpi",
            "NexonicDownloadManager-Android.apk", "NexonicDownloadManager-Android-32bit.apk"
          )
          # Android builds and GPL sources run independently. Wait for both before generating update details
          # or making the release public; otherwise the update file can permanently omit the Android APKs.
          $expected = $required + @("Android-GPL-Sources.tar.gz")
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $details = gh release view $tag --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect release assets" }
            $present = @($details.assets | Where-Object { $_.size -gt 0 -and $_.state -eq "uploaded" } | ForEach-Object { $_.name })
            $missing = @($expected | Where-Object { $_ -notin $present })
            if ($missing.Count -eq 0) { $ready = $true; break }
            Write-Host "Waiting for release assets: $($missing -join ', ')"
            Start-Sleep -Seconds 30
          }
          if (-not $ready) { throw "Release assets incomplete: $($missing -join ', ')" }
          # Fetch each update file on its own, retrying GitHub's occasional server errors, so one failed transfer
          # can't stop the release.
          New-Item -ItemType Directory -Force dl | Out-Null
          foreach ($name in $required) {
            $ok = $false
            for ($try = 1; $try -le 6 -and -not $ok; $try++) {
              gh release download $tag --dir dl --pattern $name --clobber
              if ($LASTEXITCODE -eq 0 -and (Test-Path "dl/$name")) { $ok = $true; break }
              Write-Host "Download of $name failed (attempt $try); retrying"
              Start-Sleep -Seconds (15 * $try)
            }
            if (-not $ok) { throw "Cannot download $name for update checksums" }
          }
          foreach ($name in $required) {
            if (-not (Test-Path "dl/$name")) { throw "Missing update asset: $name" }
          }
          $base = "https://github.com/$repo/releases/download/$tag"
          $assets = @(Get-ChildItem dl | Sort-Object Name | ForEach-Object {
            [ordered]@{ name = $_.Name; browser_download_url = "$base/$($_.Name)"; digest = "sha256:" + (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() }
          })
          if ($assets.Count -ne $required.Count) { throw "Expected $($required.Count) update files, found $($assets.Count)" }
          [ordered]@{
            tag_name = $tag; html_url = "https://github.com/$repo/releases/tag/$tag"; draft = $false; prerelease = $false
            body = (Get-Content CHANGELOG.md -Raw); assets = $assets
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM latest.json
          gh release upload $tag latest.json --clobber
      - name: Publish the release (all Mac, Windows and Linux files are attached now)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release edit $env:GITHUB_REF_NAME --draft=false --latest
